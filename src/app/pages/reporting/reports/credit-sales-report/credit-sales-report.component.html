<app-page-wrapper [gridClass]="'col-sm-12'" [title]="'credit sales report'">
  <div
    class="d-flex flex-wrap gap-3"
    button
    *hasPermission="'reporting.create'"
  >
    <a
      (click)="export()"
      class="align-items-center btn btn-theme d-flex rounded"
    >
      <i class="ri-download-2-line"></i> {{ "export" | translate }}
    </a>
  </div>
  <app-table
    [tableConfig]="tableConfig"
    [dateRange]="true"
    (tableChanged)="onTableChange($event)"
  >
    @if(open){
    <div advanceFilter class="show-box mb-4 d-block product-category-option">
      <div class="row g-sm-4 g-3">
        <div class="col-xl-4 col-lg-6 col-md-3 col-sm-6">
          @if(isBrowser) {
          <select2
            class="custom-select"
            [placeholder]="'select_product_type' | translate"
            [data]="product_plans.length ? product_plans : []"
            (update)="applyFilter($event)"
            noResultMessage="{{ 'no_data_found' | translate }}"
            resettable
          >
          </select2>
          }
        </div>
      </div>
    </div>
    }
  </app-table>
</app-page-wrapper>

<app-import-csv-modal [module]="'reporting'" #csvModal> </app-import-csv-modal>

<app-digital-download-modal #downloadModal> </app-digital-download-modal>
