<app-page-wrapper [gridClass]="'col-sm-12'" [title]="'investment_history'">
  <div button></div>
  <app-table
    [searchInput]="true"
    [dateRange]="true"
    [tableConfig]="tableConfig"
    (tableChanged)="onTableChange($event)"
    (action)="onActionClicked($event)"
  >
    <div advanceFilter class="show-box mb-4 d-block product-category-option">
      <div class="row g-sm-4 g-3">
        <div class="col-xl-4 col-lg-6 col-md-4 col-sm-6">
          @if(isBrowser) {
          <select2
            class="custom-select"
            [placeholder]="'filter_by_investment_pool' | translate"
            [data]="investmentOptions"
            (update)="applyPoolFilter($event)"
            noResultMessage="{{ 'no_data_found' | translate }}"
            resettable
          ></select2>
          }
        </div>
      </div>
    </div>
  </app-table>
</app-page-wrapper>
