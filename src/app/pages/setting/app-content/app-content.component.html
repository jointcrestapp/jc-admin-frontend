<app-page-wrapper [title]="'App Content Settings'">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label for="welcome_video_url" class="form-label fw-semibold">Welcome Video URL</label>
      <input
        class="form-control"
        id="welcome_video_url"
        type="url"
        formControlName="welcome_video_url"
        placeholder="https://www.youtube.com/watch?v=... or direct video link"
      />
      <small class="text-muted d-block mt-1">
        YouTube or direct video URL shown to first-time members on the mobile app.
      </small>
    </div>

    <div class="mt-4">
      <app-button [id]="'save_btn'">
        {{ type === 'create' ? 'Save Settings' : 'Update Settings' }}
      </app-button>
    </div>
  </form>
</app-page-wrapper>
