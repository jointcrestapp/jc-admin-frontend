<app-page-wrapper [gridClass]="'col-sm-12'" [title]="'users'">
  <div class="d-flex flex-wrap gap-2" *hasPermission="'user.create'" button>
    <a
      href="javascript:void(0)"
      class="align-items-center btn btn-light-bg me-2"
      (click)="CSVModal.openModal()"
    >
      <i class="ri-upload-2-line"></i> {{ "import" | translate }}
    </a>
    <a
      href="javascript:void(0)"
      class="align-items-center btn btn-light-bg me-2"
      (click)="export()"
    >
      <i class="ri-download-2-line"></i> {{ "export" | translate }}
    </a>
    <a [routerLink]="['/user/create']" class="align-items-center btn btn-theme">
      <i class="ri-add-line"></i> {{ "add_user" | translate }}
    </a>
  </div>
  <app-table
    [searchInput]="true"
    [dateRange]="true"
    [tableConfig]="tableConfig"
    [hasCheckbox]="true"
    (tableChanged)="onTableChange($event)"
    (rowClicked)="edit($event)"
    (action)="onActionClicked($event)"
  >
    @if(open){
    <div advanceFilter class="show-box mb-4 d-block product-category-option">
      <div class="row g-sm-4 g-3">
        <div class="col-xl-4 col-lg-6 col-md-3 col-sm-6">
          @if(isBrowser) {
          <select2
            class="custom-select"
            [placeholder]="'select_status' | translate"
            [data]="memberStatus.length ? memberStatus : []"
            (update)="applyFilter($event)"
            noResultMessage="{{ 'no_data_found' | translate }}"
            resettable
          >
          </select2>
          }
        </div>
      </div>
    </div>
    }
  </app-table>
</app-page-wrapper>

<app-import-csv-modal [module]="'user'" #csvModal> </app-import-csv-modal>
